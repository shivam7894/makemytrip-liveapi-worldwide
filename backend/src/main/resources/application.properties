spring.config.import=optional:file:.env[.properties]
spring.application.name=makemytrip-backend
server.port=${PORT:8080}

# Default database: H2 file DB so the project runs immediately without installing MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mmt_db;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Optional live aviation provider. Get a key from Aviationstack and set AVIATION_API_KEY.
aviation.api.key=${AVIATION_API_KEY:}
aviation.api.base-url=${AVIATION_API_BASE_URL:http://api.aviationstack.com/v1}

# Optional Amadeus provider for live flight/hotel offers.
amadeus.client.id=${AMADEUS_CLIENT_ID:}
amadeus.client.secret=${AMADEUS_CLIENT_SECRET:}
amadeus.base-url=${AMADEUS_BASE_URL:https://api.amadeus.com}

# Free live APIs used without a key.
weather.api.base-url=${WEATHER_API_BASE_URL:https://api.open-meteo.com/v1/forecast}
fx.api.base-url=${FX_API_BASE_URL:https://api.frankfurter.app/latest}

# Polling intervals
live.flight.poll-ms=${LIVE_FLIGHT_POLL_MS:30000}
live.market.poll-ms=${LIVE_MARKET_POLL_MS:15000}

# SMTP for real email OTPs. If left blank, the app exposes a development OTP in the response so local testing still works.
mail.smtp.host=${MAIL_SMTP_HOST:}
mail.smtp.port=${MAIL_SMTP_PORT:587}
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.auth=${MAIL_SMTP_AUTH:true}
mail.smtp.starttls=${MAIL_SMTP_STARTTLS:true}
mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# Real payments. Booking remains PENDING_PAYMENT until the gateway verifies payment.
payment.required=${PAYMENT_REQUIRED:true}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
payment.upi-vpa=${PAYMENT_UPI_VPA:}
payment.merchant-name=${PAYMENT_MERCHANT_NAME:MakeMyTrip Clone}
